<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM MALFUNCTION</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Courier New', Courier, monospace; 
            background: #050507; 
            color: #ff0000; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* ЭФФЕКТ СКАНИРУЮЩИХ ЛИНИЙ ТЕРМИНАЛА */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 99;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* ПОЛНОЭКРАННЫЕ ГЛИТЧ-ПОМЕХИ (ПРОБЕГАЮТ РАЗ В 4 СЕКУНДЫ) */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0.1);
            opacity: 0;
            z-index: 98;
            pointer-events: none;
            animation: screenGlitch 4s infinite;
        }

        @keyframes screenGlitch {
            0%, 93%, 98%, 100% { opacity: 0; transform: skewX(0deg); }
            94% { opacity: 0.8; background: rgba(255,0,0,0.2); transform: skewX(5deg) scaleY(1.1); }
            95% { opacity: 0.4; background: rgba(0,0,255,0.2); transform: skewX(-5deg); }
            96% { opacity: 0.9; transform: skewX(2deg); }
            97% { opacity: 0; }
        }

        .terminal-box {
            max-width: 450px;
            width: 100%;
            background: rgba(10, 5, 5, 0.95);
            padding: 40px 30px;
            border: 2px solid #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2), inset 0 0 15px rgba(255, 0, 0, 0.1);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* ГЛИТЧ ТЕКСТ (ХРОМАТИЧЕСКАЯ АБЕРРАЦИЯ) */
        .glitch-title {
            font-size: 2.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            position: relative;
            display: inline-block;
            margin-bottom: 5px;
            text-shadow: 0.05em 0 0 rgba(255,0,0,.75), -0.025em -0.05em 0 rgba(0,255,0,.75), 0.025em 0.05em 0 rgba(0,0,255,.75);
            animation: textGlitch 1s infinite alternate-reverse;
        }

        @keyframes textGlitch {
            0% { text-shadow: 2px 0 0 rgba(255,0,0,.75), -1px -2px 0 rgba(0,255,0,.75), 1px 2px 0 rgba(0,0,255,.75); }
            14% { text-shadow: 2px 0 0 rgba(255,0,0,.75), -1px -2px 0 rgba(0,255,0,.75), 1px 2px 0 rgba(0,0,255,.75); }
            15% { text-shadow: -2px -2px 0 rgba(255,0,0,.75), 2px 2px 0 rgba(0,255,0,.75), -2px 3px 0 rgba(0,0,255,.75); transform: skewX(10deg); }
            16% { text-shadow: 3px 1px 0 rgba(255,0,0,.75), -2px -1px 0 rgba(0,255,0,.75), 2px -2px 0 rgba(0,0,255,.75); transform: skewX(-15deg); }
            17% { text-shadow: 2px 0 0 rgba(255,0,0,.75), -1px -2px 0 rgba(0,255,0,.75), 1px 2px 0 rgba(0,0,255,.75); transform: skewX(0deg); }
            100% { text-shadow: 1px 2px 0 rgba(255,0,0,.75), -2px -1px 0 rgba(0,255,0,.75), -1px -2px 0 rgba(0,0,255,.75); }
        }

        .status {
            font-size: 0.85rem;
            color: #555;
            letter-spacing: 5px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* ЦИФРОВОЙ ИСКАЖЕННЫЙ ГЛАЗ */
        .eye-zone {
            width: 100%;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 35px;
            background: #000;
            border: 1px dashed #300;
            overflow: hidden;
            position: relative;
        }

        .demon-eye {
            width: 140px;
            height: 80px;
            background: #ff0000;
            border-radius: 50%/50%;
            box-shadow: 0 0 20px #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: eyeBlink 3s infinite, eyeGlitch 5s infinite;
        }

        .pupil {
            width: 18px;
            height: 70px;
            background: #000;
            border-radius: 50%;
        }

        @keyframes eyeBlink {
            0%, 92%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0); }
        }

        @keyframes eyeGlitch {
            0%, 94%, 96%, 100% { transform: translate(0, 0) scaleX(1); filter: hue-rotate(0deg); }
            95% { transform: translate(-10px, 5px) scaleX(1.3); filter: hue-rotate(90deg) saturate(3); }
            97% { transform: translate(10px, -5px) scaleY(0.8); }
        }

        /* СПИСОК С ТРЯСКОЙ ПРИ НАВЕДЕНИИ */
        .data-list {
            list-style: none;
            text-align: left;
            margin-bottom: 35px;
        }

        .data-list li {
            padding: 12px 5px;
            border-bottom: 1px solid #200;
            font-size: 0.95rem;
            color: #888;
            transition: color 0.2s;
        }

        .data-list li:hover {
            color: #fff;
            animation: shake 0.3s infinite linear;
        }

        .data-list li strong {
            color: #ff0000;
            float: right;
        }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-2px, 1px); }
            40% { transform: translate(1px, -1px); }
            60% { transform: translate(-1px, -1px); }
            80% { transform: translate(2px, 1px); }
            100% { transform: translate(0, 0); }
        }

        /* ГЛИТЧ КНОПКА */
        .glitch-btn {
            display: block;
            background: #ff0000;
            color: #000;
            padding: 15px;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: 1px solid #ff0000;
            transition: 0.2s;
            position: relative;
        }

        .glitch-btn:hover {
            background: #000;
            color: #ff0000;
            box-shadow: 0 0 20px #ff0000;
            animation: shake 0.2s infinite linear;
        }
    </style>
</head>
<body>

    <div class="terminal-box">
        
        <!-- Глаз, который штормит от глитчей -->
        <div class="eye-zone">
            <div class="demon-eye">
                <div class="pupil"></div>
            </div>
        </div>

        <!-- Текст, который двоится -->
        <h1 class="glitch-title">АНДРЕЙ ИВАНОВИЧ</h1>
        <div class="status">▲ PROTOCOL_666 ▲</div>

        <!-- Наведи мышку на строки, чтобы они начали дергаться -->
        <ul class="data-list">
            <li>[ОБИТЕЛЬ]: <strong>ААСК</strong></li>
            <li>[ОРДЕН]: <strong>ДЕКОР И ОТДЕЛКА</strong></li>
            <li>[СТАТУС]: <strong>ЦИФРОВОЙ ХАОС</strong></li>
            <li>[ПРИБЫТИЕ]: <strong>01.01.200X</strong></li>
        </ul>

        <!-- Кнопка с эффектом тряски -->
        <a href="https://t.me" target="_blank" class="glitch-btn">ПРИЗВАТЬ ТГ</a>
    </div>

</body>
</html>
