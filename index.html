<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #000000; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            position: relative;
        }
        canvas { 
            display: block; 
            max-width: 100vw; 
            max-height: 100vh; 
        }
        .tg-hidden-link {
            position: absolute;
            bottom: 30px;
            color: #0b0b0b;
            text-decoration: none;
            font-family: monospace;
            font-size: 0.75rem;
            letter-spacing: 5px;
            transition: all 0.6s ease;
            text-transform: uppercase;
            padding: 10px 20px;
            z-index: 10;
        }
        .tg-hidden-link:hover {
            color: #400000;
            text-shadow: 0 0 8px rgba(64, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <!-- Графический движок существа -->
    <canvas id="monsterCanvas" width="500" height="500"></canvas>

    <!-- Скрытая ссылка на контакт -->
    <a href="https://t.me" target="_blank" class="tg-hidden-link">CONTACT_COMMUNICATION</a>

    <script>
        const canvas = document.getElementById('monsterCanvas');
        const ctx = canvas.getContext('2d');

        // Параметры анимации живого существа
        let time = 0;
        let lickTime = 0;
        let isLicking = false;
        let nextLickIn = 100;

        // Положение зрачков (случайный автономный взгляд)
        let eyeTargetX = 0, eyeTargetY = 0;
        let eyeCurrentX = 0, eyeCurrentY = 0;

        function drawMonster() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            time += 0.03;

            // Эффект дыхания монстра
            let breath = Math.sin(time * 0.8) * 2;
            let microShakeX = Math.sin(time * 5) * 0.5;
            let microShakeY = Math.cos(time * 4.3) * 0.5;

            ctx.save();
            ctx.translate(canvas.width / 2 + microShakeX, canvas.height / 2 + microShakeY + breath);

            // 1. РИСУЕМ ГЛАЗА (Левый и Правый)
            drawEye(-100, -60, -18 * Math.PI / 180, false);
            drawEye(100, -60, 18 * Math.PI / 180, true);

            // 2. РИСУЕМ ПАСТЬ И ЗУБЫ
            drawMouth();

            ctx.restore();
            
            // Логика таймера облизывания
            if (!isLicking) {
                nextLickIn--;
                if (nextLickIn <= 0) { isLicking = true; lickTime = 0; }
            } else {
                lickTime += 0.04;
                if (lickTime > Math.PI) { isLicking = false; nextLickIn = 200 + Math.random() * 200; }
            }

            // Плавный перевод автономного взгляда
            if (Math.random() < 0.02) {
                let angle = Math.random() * Math.PI * 2;
                let dist = Math.random() * 8;
                eyeTargetX = Math.cos(angle) * dist;
                eyeTargetY = Math.sin(angle) * dist;
            }
            eyeCurrentX += (eyeTargetX - eyeCurrentX) * 0.1;
            eyeCurrentY += (eyeTargetY - eyeCurrentY) * 0.1;

            requestAnimationFrame(drawMonster);
        }

        function drawEye(cx, cy, angle, isRight) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);

            // Глазница (тень)
            ctx.beginPath();
            ctx.ellipse(0, 0, 55, 18, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#030000';
            ctx.fill();

            // Веки и глубина
            ctx.globalOpacity = 0.65;
            let eyeGlow = ctx.createRadialGradient(0, 0, 5, 0, 0, 55);
            eyeGlow.addColorStop(0, '#120101');
            eyeGlow.addColorStop(0.7, '#050000');
            eyeGlow.addColorStop(1, '#000000');
            ctx.fillStyle = eyeGlow;
            ctx.fill();

            // Радужка глаза
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(0, 0, 55, 18, 0, 0, Math.PI * 2);
            ctx.clip(); // Обрезаем радужку по форме век

            // Движение зрачка
            let ox = eyeCurrentX;
            let oy = eyeCurrentY;
            if (isRight) ox = -ox;

            let irisGrad = ctx.createRadialGradient(ox, oy, 0, ox, oy, 28);
            irisGrad.addColorStop(0, '#000000');
            irisGrad.addColorStop(0.2, '#300000');
            irisGrad.addColorStop(0.6, '#9c0000');
            irisGrad.addColorStop(0.85, '#ff1a1a');
            irisGrad.addColorStop(1, '#240000');

            ctx.beginPath();
            ctx.arc(ox, oy, 25, 0, Math.PI * 2);
            ctx.fillStyle = irisGrad;
            ctx.fill();

            // Змеиный вертикальный зрачок
            let pupilPulse = 3.5 + Math.sin(time * 0.5) * 0.8;
            ctx.beginPath();
            ctx.ellipse(ox, oy, pupilPulse, 20, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // Влажные блики на роговице
            ctx.beginPath();
            ctx.arc(ox - 8, oy - 8, 3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(ox + 10, oy + 4, 1, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fill();

            ctx.restore();
            ctx.restore();
        }

        function drawMouth() {
            ctx.save();
            ctx.translate(0, 80);

            // Тень ротовой полости
            ctx.globalOpacity = 0.55;
            let mouthGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 150);
            mouthGrad.addColorStop(0, '#080101');
            mouthGrad.addColorStop(0.8, '#000000');
            ctx.beginPath();
            ctx.ellipse(0, 0, 140, 42, 0, 0, Math.PI * 2);
            ctx.fillStyle = mouthGrad;
            ctx.fill();

            // Ограничительный зажим для внутренностей пасти
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(0, 0, 140, 42, 0, 0, Math.PI * 2);
            ctx.clip();

            // 3. РИСУЕМ ЖИВОЙ ЯЗЫК (если запущен цикл)
            if (isLicking) {
                let tongueY = Math.sin(lickTime) * -22;
                let sweepX = Math.cos(lickTime * 2) * 35; // Волнообразное движение облизывания

                let tongueGrad = ctx.createLinearGradient(sweepX, tongueY + 40, sweepX, tongueY - 10);
                tongueGrad.addColorStop(0, '#1c0000');
                tongueGrad.addColorStop(0.5, '#6b0202');
                tongueGrad.addColorStop(0.85, '#b80404');
                tongueGrad.addColorStop(1, '#ff3b3b');

                ctx.beginPath();
                ctx.ellipse(sweepX, tongueY + 25, 45, 32, Math.cos(lickTime) * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = tongueGrad;
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0; // Сброс тени
            }

            // РИСУЕМ ОСТРЫЕ ЗУБЫ (Верхняя и нижняя челюсти)
            drawTeethRow(false);
            drawTeethRow(true);

            ctx.restore();
            ctx.restore();
        }

        function drawTeethRow(isLower) {
            ctx.save();
            if (isLower) ctx.transform(1, 0, 0, -1, 0, 0); // Зеркалим нижний ряд

            // Координаты для 9 анатомических зубов-клиньев
            let toothPositions = [-110, -85, -60, -35, 0, 35, 60, 85, 110];
            
            toothPositions.forEach((x, index) => {
                // Делаем клыки (индексы 1, 4, 7) длиннее остальных
                let isFang = (index === 1 || index === 4 || index === 7);
                let toothHeight = isFang ? 24 : 16;
                let toothWidth = isFang ? 8 : 6;
                
                let yTop = -36; // Базовая линия десны

                ctx.save();
                ctx.translate(x, yTop);

                // Тень позади каждого зуба для 3D объема
                ctx.beginPath();
                ctx.moveTo(-toothWidth - 1, 0);
                ctx.lineTo(0, toothHeight + 2);
                ctx.lineTo(toothWidth + 1, 0);
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fill();

                // Основа костяного клина (грязный полутон)
                ctx.beginPath();
                ctx.moveTo(-toothWidth, 0);
                ctx.lineTo(0, toothHeight);
                ctx.lineTo(toothWidth, 0);
                ctx.fillStyle = '#3a3a35';
                ctx.fill();

                // Светлая эмаль (острый край и блик)
                ctx.beginPath();
                ctx.moveTo(-toothWidth + 2, 0);
                ctx.lineTo(0, toothHeight - 2);
                ctx.lineTo(toothWidth - 2, 0);
                ctx.fillStyle = isFang ? '#949184' : '#737169';
                ctx.fill();

                ctx.restore();
            });

            ctx.restore();
        }

        // Запуск графического движка
        drawMonster();
    </script>
</body>
</html>
