<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: #000000; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* КОНТЕЙНЕР ДЛЯ МОНСТРА */
        .monster-face {
            position: relative;
            width: 400px;
            height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* ЖИВЫЕ ГЛАЗА */
        .eyes-container {
            display: flex;
            justify-content: space-between;
            width: 280px;
            margin-top: 40px;
        }

        .eye-socket {
            position: relative;
            width: 80px;
            height: 48px;
            background: #080808; 
            border-radius: 50% 15%;
            transform: rotate(-10deg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                inset 0 0 15px rgba(0, 0, 0, 0.9), 
                inset 0 4px 10px rgba(100, 0, 0, 0.2),
                0 0 8px rgba(255, 0, 0, 0.05); 
            opacity: 0.6;
            animation: blinkAction 5s infinite; /* Автономное моргание */
        }

        .eye-socket.right {
            border-radius: 15% 50%;
            transform: rotate(10px);
        }

        /* Анимация моргания век */
        @keyframes blinkAction {
            0%, 93%, 97%, 100% { transform: scaleY(1) rotate(-10deg); }
            95% { transform: scaleY(0) rotate(-10deg); }
        }
        @keyframes blinkActionRight {
            0%, 93%, 97%, 100% { transform: scaleY(1) rotate(10deg); }
            95% { transform: scaleY(0) rotate(10deg); }
        }
        .eye-socket.right {
            animation: blinkActionRight 5s infinite;
        }

        /* Объемная радужка */
        .iris {
            position: absolute;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: radial-gradient(circle, #100000 0%, #500000 50%, #990000 85%, #200000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            transition: transform 0.5s ease-in-out; /* Плавный перевод взгляда */
        }

        /* Реалистичный зрачок */
        .pupil {
            width: 8px;
            height: 32px;
            background: #000000;
            border-radius: 50%;
        }

        /* Влажный блик света */
        .iris::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }

        /* АНАТОМИЧЕСКАЯ УЛЫБКА И ЗУБЫ */
        .mouth-zone {
            position: relative;
            width: 320px;
            height: 120px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .smile {
            position: absolute;
            width: 260px;
            height: 70px;
            background: #030303;
            border-radius: 0 0 130px 130px;
            border: 2px solid rgba(120, 10, 10, 0.2);
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.9), inset 0 0 20px #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0.5;
        }

        /* Ряды зубов */
        .teeth-row {
            display: flex;
            justify-content: center;
            width: 100%;
            height: 22px;
        }

        .teeth-row.bottom {
            transform: scaleY(-1);
        }

        .tooth {
            width: 14px;
            height: 100%;
            background: linear-gradient(to bottom, #111 0%, #666 40%, #888 75%, #333 100%);
            margin: 0 1px;
            border-radius: 0 0 4px 4px;
            box-shadow: inset 1px 0 2px rgba(0,0,0,0.5);
            filter: brightness(0.7);
        }

        .tooth.fang {
            height: 130%;
            width: 15px;
            border-radius: 0 0 50% 50%;
            background: linear-gradient(to bottom, #111 0%, #777 40%, #999 80%, #333 100%);
        }

        /* ЖИВОЙ ЯЗЫК */
        .tongue {
            position: absolute;
            bottom: -40px;
            left: 50%;
            width: 90px;
            height: 80px;
            background: linear-gradient(to top, #300000, #800505 60%, #b30909 100%);
            border-radius: 40% 40% 50% 50%;
            transform: translateX(-50%) scaleY(0);
            transform-origin: bottom center;
            z-index: 2;
            box-shadow: inset 0 10px 15px rgba(0,0,0,0.6), 0 0 15px rgba(179, 9, 9, 0.4);
            border: 1px solid #400;
        }

        .tongue::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            width: 2px; height: 80%;
            background: rgba(0,0,0,0.4);
            transform: translateX(-50%);
        }

        /* Анимация облизывания */
        @keyframes lickAction {
            0% { transform: translateX(-50%) scaleY(0) translateY(0); }
            20% { transform: translateX(-50%) scaleY(1) translateY(-25px); } 
            40% { transform: translateX(-35%) scaleY(1.1) translateY(-30px) rotate(10deg); } 
            60% { transform: translateX(-65%) scaleY(1.1) translateY(-30px) rotate(-10deg); } 
            80% { transform: translateX(-50%) scaleY(1) translateY(-20px); }
            100% { transform: translateX(-50%) scaleY(0) translateY(0); } 
        }

        .tongue.lick {
            animation: lickAction 1.8s ease-in-out forwards;
        }

        /* ССЫЛКА НА ТЕЛЕГРАМ */
        .tg-anchor {
            position: absolute;
            bottom: 40px;
            color: #121212; 
            text-decoration: none;
            font-family: monospace;
            font-size: 0.8rem;
            letter-spacing: 4px;
            transition: all 0.6s ease;
            text-transform: uppercase;
            padding: 10px 20px;
            border: 1px solid transparent;
        }

        .tg-anchor:hover {
            color: #700000; 
            text-shadow: 0 0 10px rgba(112, 0, 0, 0.6);
            border-color: rgba(112, 0, 0, 0.2);
            background: rgba(5, 0, 0, 0.4);
        }
    </style>
</head>
