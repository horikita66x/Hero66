<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: #000000; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ПОЛНОЭКРАННОЕ ЖИВОЕ ВИДЕО */
        .video-background {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: 1;
            object-fit: cover;
            filter: brightness(0.6) contrast(1.2); /* Делаем видео темнее и мрачнее */
        }

        /* СКРЫТАЯ ССЫЛКА НА ТГ ПОВЕРХ ВИДЕО */
        .tg-anchor-final {
            position: absolute;
            bottom: 40px;
            color: #0f0f0f; 
            text-decoration: none;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            letter-spacing: 6px;
            transition: all 0.8s ease;
            text-transform: uppercase;
            padding: 10px 20px;
            z-index: 10;
        }

        .tg-anchor-final:hover {
            color: #500000; 
            text-shadow: 0 0 10px rgba(80, 0, 0, 0.9);
        }
    </style>
</head>
<body>

    <!-- Реалистичное видео с глазами на фоне. Оно крутится само по себе без остановки -->
    <video class="video-background" autoplay loop muted playsinline>
        <source src="https://mixkit.co" type="video/mp4">
    </video>

    <!-- Ссылка строго внизу экрана -->
    <a href="https://t.me" target="_blank" class="tg-anchor-final">CONTACT_COMMUNICATION</a>

</body>
</html>
