<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Баумштарк Андрей | Персональная страница</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: #0d0e12; 
            color: #fff; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: #161820;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #252836;
        }
        
        /* КВАДРАТНЫЙ СЛАЙДЕР С ВОЗМОЖНОСТЬЮ ЛИСТАТЬ */
        .slider-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1; /* Делает блок строго квадратным */
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #252836;
        }
        .slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease-in-out;
        }
        .slide {
            min-width: 100%;
            height: 100%;
            object-fit: cover; /* Фотография заполняет квадрат без искажений */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #ff9f1c;
            font-weight: bold;
            background: #1f222e;
        }
        /* Стрелочки для перелистывания */
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: 0.2s;
            z-index: 10;
        }
        .arrow:hover { background: #ff9f1c; color: #0d0e12; }
        .arrow-prev { left: 10px; }
        .arrow-next { right: 10px; }

        h1 { font-size: 1.8rem; margin-bottom: 5px; letter-spacing: -0.5px; text-align: center; }
        .tag { color: #ff9f1c; font-size: 0.9rem; font-weight: bold; text-transform: uppercase; text-align: center; margin-bottom: 25px; block-size: auto; }
        
        /* КОМПАКТНЫЙ БЛОК ИНФОРМАЦИИ */
        .info-list {
            list-style: none;
            margin-bottom: 25px;
        }
        .info-list li {
            padding: 12px 0;
            border-bottom: 1px solid #252836;
            font-size: 0.95rem;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }
        .info-list li:last-child { border-bottom: none; }
        .info-list strong { color: #fff; }

        .tg-btn {
            display: block;
            text-align: center;
            background: #ff9f1c;
            color: #0d0e12;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }
        .tg-btn:hover { background: #fff; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Квадратный слайдер -->
        <div class="slider-container">
            <button class="arrow arrow-prev" onclick="moveSlide(-1)">&#10094;</button>
            <button class="arrow arrow-next" onclick="moveSlide(1)">&#10095;</button>
            
            <div class="slides" id="slides">
                <!-- Первая фотка (основная) -->
                <img src="photo.jpg" alt="АБ" class="slide" onerror="this.onerror=null; this.src='https://placeholder.com';">
                <!-- Вторая фотка (заглушка, можете загрузить photo2.jpg) -->
                <img src="photo2.jpg" alt="Проект" class="slide" onerror="this.onerror=null; this.src='https://placeholder.com';">
            </div>
        </div>

        <h1>Баумштарк Андрей</h1>
        <div class="tag">Персональная страница</div>

        <!-- Краткая анкета -->
        <ul class="info-list">
            <li><span>📅 Дата рождения:</span> <strong>01.01.200X (впишите свою дату)</strong></li>
            <li><span>🏫 Раньше учился:</span> <strong>Школа №... (впишите свою школу)</strong></li>
            <li><span>🏗️ Сейчас учусь:</span> <strong>ААСК (Мастер отделочных работ)</strong></li>
            <li><span>🎯 Чем занимался:</span> <strong>Спорт, дизайн, веб-разработка (измените на свое)</strong></li>
        </ul>

        <a href="https://t.me" target="_blank" class="tg-btn">Связаться в Telegram</a>
    </div>

    <!-- Логика работы слайдера -->
    <script>
        let currentSlide = 0;
        function moveSlide(direction) {
            const slidesContainer = document.getElementById('slides');
            const totalSlides = slidesContainer.children.length;
            currentSlide = (currentSlide + direction + totalSlides) % totalSlides;
            slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
        }
    </script>
</body>
</html>
